[package]
name = "personal-productivity"
version = "0.1.0"
description = "Zenfolio offline personal desktop productivity"
edition = "2021"
rust-version = "1.98"
publish = false

[lib]
name = "personal_productivity_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono = "0.4.45"
chrono-tz = "0.10.4"
iana-time-zone = "0.1.65"
rusqlite = { version = "0.40.2", features = ["bundled", "backup"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
